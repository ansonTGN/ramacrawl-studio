[package]
name = "rama-controlled-extractor"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "Controlled, policy-driven data extraction platform built on Rama"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["portable-tls"]
portable-tls = ["rama/rustls", "rama/ring"]
boring-emulation = ["rama/boring", "rama/ua-embed-profiles"]

[dependencies]
axum = { version = "=0.8.9", features = ["json"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
hex = "0.4"
parking_lot = "0.12"
rand = "0.9"
rama = { version = "=0.3.0", default-features = false, features = ["http-full", "compression", "ws", "socks5"] }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
